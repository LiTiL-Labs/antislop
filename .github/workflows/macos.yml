# Compile and check Anti-slop on a real macOS runner. The development
# container is Linux, so this is the only place the AppKit layer is compiled
# and the Accessibility probe can touch a real TextEdit window.
name: macOS build and checks

on:
  workflow_dispatch:
  push:
    branches: [claude/anti-slop-macos-dev-ay9m4k]
    paths:
      - "app/**"
      - "prompts/**"
      - "fixtures/**"
      - "schemas/**"
      - "third_party/**"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
        # Explicit bash enables pipefail, so `| tee` cannot hide a failing step.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (release)
        run: swift build -c release 2>&1 | tee build.log

      - name: Unit tests
        run: swift test 2>&1 | tee test.log

      - name: Assemble app bundle
        run: ./scripts/build-app.sh

      - name: Accessibility probe against TextEdit
        continue-on-error: true
        timeout-minutes: 6
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          "$BIN/antislop-axprobe" textedit --allow-quit-textedit --force --out probe-textedit.json

      - name: End-to-end with fixture provider
        continue-on-error: true
        timeout-minutes: 6
        run: |
          BIN="$(swift build -c release --show-bin-path)"
          "$BIN/antislop-axprobe" e2e --app build/Anti-slop.app --force --out probe-e2e.json --shots shots

      - name: Live-mode end to end against stub runtimes (not live AI)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          # Stub CLIs where the app's runtime discovery looks first. This exercises the
          # real provider code path in the real app; it is not a live provider test.
          mkdir -p "$HOME/.local/bin"
          cp scripts/ci/fake-claude "$HOME/.local/bin/claude"
          cp scripts/ci/fake-codex "$HOME/.local/bin/codex"
          chmod +x "$HOME/.local/bin/claude" "$HOME/.local/bin/codex"
          BIN="$(swift build -c release --show-bin-path)"
          status=0
          pkill -x TextEdit || true; sleep 2
          "$BIN/antislop-axprobe" e2e --app build/Anti-slop.app --live --provider claude-code --force --out probe-stub-claude.json || status=1
          pkill -x TextEdit || true; sleep 2
          "$BIN/antislop-axprobe" e2e --app build/Anti-slop.app --live --provider codex --force --out probe-stub-codex.json || status=1
          exit $status

      - name: App lifecycle log (no text content)
        if: always()
        continue-on-error: true
        run: |
          log show --last 15m --style compact --predicate 'subsystem == "local.antislop"' 2>/dev/null | tail -150 || true
          echo "=== Anti-slop crash reports ==="
          ls -1 "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep -i antislop || echo "none"

      - name: Inspect screenshots (OCR and colors)
        if: always()
        continue-on-error: true
        run: |
          ls shots/*.png >/dev/null 2>&1 && swift scripts/inspect-shots.swift shots/app-panel-generating.png shots/app-panel-ready.png shots/app-settings.png shots/panel-processing.png shots/panel-ready.png 2>&1 | tee inspect.log || true

      - name: Compress screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p shots-small
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            name="$(basename "${f%.png}")"
            size=640; [ "$name" = "screen-ready" ] && size=900
            case "$name" in *settings*) size=620 ;; esac
            sips -s format jpeg -s formatOptions 50 -Z "$size" "$f" --out "shots-small/$name.jpg" >/dev/null
          done
          ls -la shots-small || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-evidence
          path: |
            app/build.log
            app/test.log
            app/probe-*.json
            app/shots/*.png
            app/shots-small/*.jpg
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "=== unit tests ==="
          grep -E "Executed [0-9]+ tests|error:|failed" test.log | tail -8 || true
          echo "=== screenshot inspection ==="
          [ -f inspect.log ] && cat inspect.log || echo "no inspection"
          for f in probe-textedit.json probe-e2e.json probe-stub-claude.json probe-stub-codex.json; do
            echo "=== $f ==="
            [ -f "$f" ] && python3 -c "import json,sys; d=json.load(open('$f')); print(d['macOS']); [print(('PASS' if c['passed'] else 'FAIL'), c['id'], '-', c['detail']) for c in d['checks']]" || echo missing
          done

  # Screenshots are printed one per job (base64 JPEG) so each can be read from
  # its own job log; artifact downloads are not reachable from the dev container.
  screenshot-log:
    needs: build-and-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        image: [app-panel-generating, app-panel-ready, app-settings, screen-ready]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-evidence
          path: evidence
      - name: Image statistics
        continue-on-error: true
        run: |
          pip install -q pillow >/dev/null 2>&1 || true
          python3 - <<'PY'
          import glob
          from PIL import Image, ImageStat
          for f in sorted(glob.glob("evidence/shots-small/*.jpg")):
              im = Image.open(f).convert("RGB")
              colors = len(set(im.resize((160, 120)).getdata()))
              print(f, im.size, "stddev", [round(x, 1) for x in ImageStat.Stat(im).stddev], "distinct colors (160x120):", colors)
          PY
      - name: Print ${{ matrix.image }}
        run: |
          f="evidence/shots-small/${{ matrix.image }}.jpg"
          if [ -f "$f" ]; then echo "BEGIN_IMAGE"; base64 -w 0 "$f"; echo; echo "END_IMAGE"; else echo "no $f"; fi
